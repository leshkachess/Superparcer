[project]
name = "superparcer"
version = "0.1.0"
description = "Telegram Mini App for searching clothes across stores"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.20,<4",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "playwright==1.61.0",
    "pydantic-settings>=2.9,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
